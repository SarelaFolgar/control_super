name: Process New Data

# AÑADE ESTAS 3 LÍNEAS PARA QUE NO DE ERROR EL CSV:
concurrency: 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # ¡IMPORTANTE: false!

on:
  workflow_dispatch:  # Permite ejecución manual
  push:
    paths:
      - 'datos_super.csv'  # Se activa cuando cambia el CSV manualmente
  repository_dispatch:  # PARA QUE LA API PUEDA DISPARARLO
    types: [process-data]

jobs:
  process-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Instalar dependencias
        run: |
          pip install pandas numpy
          
      - name: 🏃‍♂️ Ejecutar procesamiento
        run: |
          cd funciones_python
          python procesar_datos.py
          cd ..  # VOLVER AL DIRECTORIO PRINCIPAL
          
      - name: 💾 Commit y push cambios
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add datos_super.json
          git commit -m "🔄 Actualizar JSON automáticamente [skip ci]" || echo "No hay cambios"
          git push origin HEAD:main
