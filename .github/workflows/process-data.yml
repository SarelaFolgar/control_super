name: Process New Data

concurrency:
  group: "process-data-${{ github.ref }}"
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'datos_super.csv'
    branches: [ main ]
  repository_dispatch:
    types: [process-data]

jobs:
  process-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 📦 Install dependencies
        run: pip install pandas numpy
          
      - name: 🏃‍♂️ Process data
        run: cd funciones_python && python procesar_datos.py
          
      - name: 🔍 Check for changes
        id: check_changes
        run: |
          if git diff --quiet datos_super.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: 💾 Commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add datos_super.json
          git commit -m "🔄 Update JSON from CSV"
          git pull --rebase origin main
          git push origin HEAD:main
