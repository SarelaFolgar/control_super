<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Compra - Análisis de Precios</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navegación lateral -->
    <nav class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fas fa-chart-line"></i>
            <span>PriceTrack</span>
        </div>
        
        <div class="nav-section">
            <h3>ANÁLISIS</h3>
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Inicio</span>
            </a>
            <a href="index.html" class="nav-link" data-action="variation-analysis">
                <i class="fas fa-arrow-up"></i>
                <span>Variación</span>
            </a>
            <a href="index.html" class="nav-link" data-action="inflation-analysis">
                <i class="fas fa-chart-pie"></i>
                <span>Inflación</span>
            </a>
        </div>
        
        <div class="nav-section">
            <h3>DATOS</h3>
            <a href="index.html" class="nav-link" data-action="all-products">
                <i class="fas fa-list"></i>
                <span>Todos los productos</span>
            </a>
            <a href="agregar.html" class="nav-link active">
                <i class="fas fa-plus-circle"></i>
                <span>Agregar datos</span>
            </a>
            <a href="index.html" class="nav-link" data-action="by-supermarket">
                <i class="fas fa-store"></i>
                <span>Por supermercado</span>
            </a>
            <a href="index.html" class="nav-link" data-action="by-city">
                <i class="fas fa-city"></i>
                <span>Por ciudad</span>
            </a>
            <a href="index.html" class="nav-link" data-action="by-date">
                <i class="fas fa-calendar-alt"></i>
                <span>Resumen anual</span>
            </a>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="main-content" id="main-content">
        <div class="container">
            <h1><i class="fas fa-cart-plus"></i> Agregar Nueva Compra</h1>
            
            <form id="compra-form">
                <!-- Fecha -->
                <div class="form-group">
                    <label for="fecha"><i class="fas fa-calendar"></i> Fecha:</label>
                    <input type="date" id="fecha" required>
                </div>
                
                <!-- Supermercado -->
                <div class="form-group">
                    <label for="supermercado"><i class="fas fa-store"></i> Supermercado:</label>
                    <select id="supermercado" required>
                        <option value="">Seleccionar...</option>
                    </select>
                    <input type="text" id="nuevo-super" placeholder="Otro supermercado..." style="display: none;">
                </div>
                
                <!-- Productos dinámicos -->
                <div id="productos-container">
                    <div class="producto-item">
                        <h3>Producto 1</h3>
                        
                        <!-- Nombre del producto -->
                        <div class="form-group">
                            <label for="producto-1">Producto:</label>
                            <input type="text" id="producto-1" class="producto-input" 
                                   placeholder="Ej: lomo adobado, pan, arroz...">
                            <div class="sugerencias" id="sugerencias-1"></div>
                        </div>
                        
                        <!-- Cantidad y unidad -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cantidad-1">Cantidad:</label>
                                <input type="number" id="cantidad-1" step="0.01" placeholder="Ej: 1000">
                            </div>
                            <div class="form-group">
                                <label for="unidad-1">Unidad:</label>
                                <select id="unidad-1">
                                    <option value="g">g (gramos)</option>
                                    <option value="ud">ud (unidades)</option>
                                </select>
                            </div>
                        </div>
                        
                        <!-- Marca y precio -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="marca-1">Marca:</label>
                                <input type="text" id="marca-1" placeholder="Ej: no aplica">
                            </div>
                            <div class="form-group">
                                <label for="precio-1">Precio (€):</label>
                                <input type="number" id="precio-1" step="0.01" placeholder="Ej: 2.81">
                            </div>
                        </div>
                        
                        <!-- Precio calculado -->
                        <div class="precio-calculado" id="precio-calc-1">
                            <small>Precio por 1kg/unidad: <span>-</span></small>
                        </div>
                        
                        <button type="button" class="btn-eliminar" onclick="eliminarProducto(this)">
                            <i class="fas fa-trash"></i> Eliminar
                        </button>
                    </div>
                </div>
                
                <!-- Botones -->
                <div class="form-buttons">
                    <button type="button" class="btn-secondary" onclick="agregarProducto()">
                        <i class="fas fa-plus"></i> Agregar otro producto
                    </button>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-paper-plane"></i> Enviar compra
                    </button>
                    
                    <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
                
                <!-- Mensajes -->
                <div id="mensaje" class="mensaje"></div>
            </form>
        </div>
    </main>

    <!-- Footer simplificado -->
    <footer class="footer">
        <div class="footer-content">
            <p><i class="fas fa-code"></i> PriceTrack - Análisis de precios</p>
            <p><i class="fas fa-database"></i> <span id="footer-total-data">0</span> registros analizados</p>
        </div>
    </footer>
    
    <script src="agregar.js"></script>
</body>
</html>
